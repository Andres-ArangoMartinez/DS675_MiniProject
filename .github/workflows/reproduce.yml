name: Reproduce Milestone 2 evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descriptive-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python scripts/validate_repository_hygiene.py
      - run: python -m pip install -r requirements.txt
      - run: python reproduce.py --download
      - run: python scripts/run_tests.py
      - run: python scripts/execute_notebook.py
      - run: python scripts/validate_ai_interactions.py
      - run: python scripts/validate_repository.py
